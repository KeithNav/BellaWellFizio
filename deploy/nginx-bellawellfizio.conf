# bellawellfizio.hu - nginx site (a szerveren: /etc/nginx/sites-available/bellawellfizio)
# Feltoltes: powershell -ExecutionPolicy Bypass -File scripts\deploy.ps1 -Target nginx   (mentes + nginx -t + reload)
# FIGYELEM: csak a bellawellfizio sitehoz tartozik; a masik oldal (eletkertjudittal.hu) sajat fajljaiban van, azokhoz nem szabad nyulni.

server {
    server_name bellawellfizio.hu;

    root /var/www/bellawell;
    index index.html;
    client_max_body_size 64m;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Duplicate URLs of the canonical pages go to the canonical address (the prerendered files are served without .html).
    if ($request_uri ~ ^/index\.html(\?.*)?$) { return 301 /; }
    if ($request_uri ~ ^/(impresszum|adatvedelem)\.html(\?.*)?$) { return 301 /$1; }
    rewrite ^/(impresszum|adatvedelem)/$ /$1 permanent;

    location = /site.webmanifest {
        default_type application/manifest+json;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /uploads/ {
        alias /opt/bellawell/backend/public/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ~ ^/(api|admin|content-manager|content-type-builder|upload|users-permissions|email|i18n|_health)(/|$) {
        proxy_pass http://127.0.0.1:1338;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Only real pages exist; every other URL is a real 404 (noindex 404.html), not the home page.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/bellawellfizio.hu/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/bellawellfizio.hu/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# www -> bellawellfizio.hu (one canonical host)
server {
    server_name www.bellawellfizio.hu;

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/bellawellfizio.hu/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/bellawellfizio.hu/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    return 301 https://bellawellfizio.hu$request_uri;
}

# http -> https on the canonical host in a single redirect
server {
    listen 80;
    listen [::]:80;
    server_name bellawellfizio.hu www.bellawellfizio.hu;

    return 301 https://bellawellfizio.hu$request_uri;
}
